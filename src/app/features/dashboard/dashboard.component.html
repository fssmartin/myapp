
<div class="page-layout">

  <div class="layout-header"> 
    <app-breadcrumb></app-breadcrumb>
  </div>

  <div class="layout-content">


    <app-product-list [items]="productStore.products()"></app-product-list>
     
   
    @if (authStore.isLogged()) {

      <app-info-user-activity 
        [infoUser] = "authStore.user()"
        [remainingTime] = "authStore.remainingTime()">
      </app-info-user-activity> 

    }

  </div> 


</div>
