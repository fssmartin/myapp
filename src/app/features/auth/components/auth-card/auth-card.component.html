
<!-- para que todas tengan la misma estructura  -->
<!-- login, register, forgot-password  -->

<div class="auth-card">

      <div class="auth-header">        
        <h1>{{ title() }}</h1>
        <span >{{ subtitle() }}</span>
      </div>

      <!-- BODY -->
      <div class="auth-body">
           <ng-content select="[body]"></ng-content>
      </div>

      <!-- FOOTER -->
      <div class="auth-footer" >
         <ng-content select="[footer]"></ng-content>
      </div>

</div>
