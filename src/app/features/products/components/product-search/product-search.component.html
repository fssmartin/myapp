<mat-form-field appearance="outline" class="search-field">
  <mat-label>Buscar producto</mat-label>

  <input
    matInput
    placeholder="Introduce un producto"
    [ngModel]="searchText()"
    (ngModelChange)="searchText.set($event)"
    (keyup.enter)="onSearch()"
  >

  <button
    mat-icon-button
    matSuffix
    type="button"
    (click)="onSearch()"
  >
    <mat-icon>search</mat-icon>
  </button>
</mat-form-field>
